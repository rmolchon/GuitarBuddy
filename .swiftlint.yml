included:
  - GuitarBuddy
  - GuitarBuddyTests
  - GuitarBuddyUITests

# Mirrors the project conventions in CLAUDE.md: files < 800 lines, functions < 50 lines.
file_length:
  warning: 400
  error: 800

function_body_length:
  warning: 40
  error: 50

type_body_length:
  warning: 250
  error: 400

line_length:
  warning: 160
  error: 200
  ignores_comments: true
  ignores_urls: true

nesting:
  type_level: 2

identifier_name:
  min_length: 1 # allow `i`, `f`, `n` in DSP math
  excluded: [id, hz]

opt_in_rules:
  - empty_count
  - first_where
  - implicit_return
  - sorted_first_last
  - unneeded_parentheses_in_closure_argument

disabled_rules:
  - todo
  - multiple_closures_with_trailing_closure

custom_rules:
  no_print:
    name: "No print statements"
    regex: '^\s*print\('
    message: "Use os.Logger via AppLogger instead of print()."
    severity: warning
