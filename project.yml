name: GuitarBuddy
options:
  bundleIdPrefix: com.guitarbuddy
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""

targets:
  GuitarBuddy:
    type: application
    platform: iOS
    sources:
      - path: GuitarBuddy
    resources:
      - path: GuitarBuddy/Resources/Assets.xcassets
    info:
      path: GuitarBuddy/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "GuitarBuddy uses the microphone to detect the pitch of your guitar for tuning and other audio tools."
        CFBundleDisplayName: "GuitarBuddy"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guitarbuddy.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false

  GuitarBuddyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GuitarBuddyTests
    dependencies:
      - target: GuitarBuddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guitarbuddy.app.tests

  GuitarBuddyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GuitarBuddyUITests
    dependencies:
      - target: GuitarBuddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guitarbuddy.app.uitests

schemes:
  GuitarBuddy:
    build:
      targets:
        GuitarBuddy: all
        GuitarBuddyTests: [test]
        GuitarBuddyUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GuitarBuddyTests
        - GuitarBuddyUITests
